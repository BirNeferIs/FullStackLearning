<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"
        placeholder="Your Name" required>
    <br>
        <label for="surname">Surname</label>
        <input type="text" name="surname" id="surname"
        placeholder="Your SurName">

    <br>
        <label for="password">Password</label>
        <input type="password" name="password" id="password"
        placeholder="Your password">
        

    <br>
        <label for="email">Email</label>
        <input type="email" name="email" id="email"
        placeholder="Your email">

    <br>
        <label for="phone">Phone</label>
        <input type="tel" name="phone" id="phone"
        placeholder="Your phone">

    <br>
        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob"
        placeholder="Your Date of Birth">
        <br>
        <label for="number">Age</label>
        <input type="number" name="number" id="number"
        placeholder="Your age" min="0" max="100">



        <br>
        
        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="male" value="man">Male
        <input type="radio" name="gender" id="female" value="woman">Female

        <br>
        <select name="" id="">
            <option value="">1</option value="1">
            <option value="">2</option value="2">
            <option value="">3</option value="3">
        </select>
        <br>
        <label for="">LoremIpsum</label>
        <input type="checkbox" name="" id="">

        <br>
            
        <textarea name="" id="" cols="15" rows="5"></textarea>

        <br>

        <input type="file" name="" id="" accept=".pdf">

        <br>
        <input type="reset">
        <input type="submit">
    </form>
</body>
</html>
