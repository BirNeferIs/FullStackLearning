<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick = "Press();" style="background-color: orange; color: white; border-radius: 10px;">Press Here</button>
    <p id="press">Press Button</p>
    <script>
        function Press(){
            document.getElementById("press").innerHTML = "You pressed the button"
        }
    </script>
</body>
</html>
